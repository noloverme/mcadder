<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Deep Wave Gradient -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="280" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="280" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="110" r="160" fill="#a855f7" fill-opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="60" r="100" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Futuristic Border -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Waves / Sleek Bottom -->
  <path d="M 0 215 C 300 245, 450 185, 750 210 C 950 225, 1100 195, 1200 205 L 1200 280 L 0 280 Z" fill="url(#waveGrad2)" />
  <path d="M 0 230 C 250 190, 500 250, 800 215 C 1000 195, 1120 235, 1200 225 L 1200 280 L 0 280 Z" fill="url(#waveGrad)" />

  <!-- Cube / Minecraft Symbol Icon -->
  <g transform="translate(600, 50)">
    <!-- Hexagon Isometric Block -->
    <path d="M 0 -22 L 20 -10 L 20 12 L 0 24 L -20 12 L -20 -10 Z" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <path d="M 0 -22 L 20 -10 L 0 1 L -20 -10 Z" fill="#6366f1" fill-opacity="0.6" />
    <path d="M 0 1 L 20 -10 L 20 12 L 0 24 Z" fill="#4f46e5" fill-opacity="0.8" />
    <path d="M -20 -10 L 0 1 L 0 24 L -20 12 Z" fill="#3730a3" fill-opacity="0.9" />
  </g>

  <!-- Title & Subtitle -->
  <g text-anchor="middle">
    <text x="600" y="125" class="title-text" fill="url(#titleGrad)" filter="url(#glow)">
      MC ADDER &amp; SCANNER
    </text>
    <text x="600" y="158" class="subtitle-text">
      Высокоскоростной SLP-сканер портов 25000–26000 • Проверка авторизации • Менеджер servers.dat
    </text>
  </g>

  <!-- Feature Pills / Badges -->
  <g transform="translate(600, 185)">
    <!-- Pill 1: SLP Fast Ping -->
    <g transform="translate(-370, 0)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" class="badge-text" fill="#a5b4fc">⚡ 1000+ SLP PING</text>
    </g>
    <!-- Pill 2: Login Check -->
    <g transform="translate(-125, 0)">
      <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#3b0764" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" class="badge-text" fill="#f0abfc">🔑 LOGIN DETECTOR</text>
    </g>
    <!-- Pill 3: Proxy Pool -->
    <g transform="translate(125, 0)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" class="badge-text" fill="#5eead4">🛡️ PROXY ROTATOR</text>
    </g>
    <!-- Pill 4: NBT Injector -->
    <g transform="translate(370, 0)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" class="badge-text" fill="#7dd3fc">💾 NBT INJECTOR</text>
    </g>
  </g>
</svg>
